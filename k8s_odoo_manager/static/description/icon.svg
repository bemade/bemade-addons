<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#714B67;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8F5C7A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Cow face made from Odoo O shape -->
  <g transform="translate(64,64)">
    <!-- Main face - Odoo O shape (larger) -->
    <ellipse cx="0" cy="0" rx="44" ry="40" fill="#ffffff"/>
    
    <!-- Cow spots -->
    <ellipse cx="-18" cy="-12" rx="10" ry="8" fill="#333333" transform="rotate(-15)"/>
    <ellipse cx="20" cy="-8" rx="8" ry="6" fill="#333333" transform="rotate(20)"/>
    <ellipse cx="12" cy="10" rx="6" ry="5" fill="#333333" transform="rotate(10)"/>
    
    <!-- Eyes -->
    <ellipse cx="-16" cy="-10" rx="6" ry="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <ellipse cx="16" cy="-10" rx="6" ry="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <circle cx="-16" cy="-9" r="3" fill="#333333"/>
    <circle cx="16" cy="-9" r="3" fill="#333333"/>
    
    <!-- Snout/muzzle -->
    <ellipse cx="0" cy="14" rx="18" ry="14" fill="#F5D6C6"/>
    
    <!-- Nostrils -->
    <ellipse cx="-6" cy="14" rx="4" ry="3" fill="#333333"/>
    <ellipse cx="6" cy="14" rx="4" ry="3" fill="#333333"/>
  </g>
  
  <!-- Horns (small, cute) -->
  <path d="M 32 28 Q 24 14 32 10" stroke="#F5D6C6" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 96 28 Q 104 14 96 10" stroke="#F5D6C6" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
