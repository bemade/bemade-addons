name: tests

# Runbot-style split. The install job installs every addon once, running the
# at_install tests in install order as a single run would, and dumps the
# database. Each test shard restores that dump into its own PostgreSQL and runs
# a share of the post_install test classes, balanced on the class durations of
# the latest run. "Test Repo Addons With Odoo" is the required check: it passes
# only if the install job and every shard did.
#
# The install job and the shards run on Bemade's self-hosted runners (scale set
# arc-bemade-addons, odoo-ci/arc-bemade-addons-values.yaml): the image carries
# Odoo Enterprise, so it is pulled inside the cluster, and the database handed
# from the install job to the shards is encrypted before it becomes an
# artifact of this public repository.

on:
  pull_request:
    branches:
      - "17.0"
      - "18.0"
      - "19.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read  # read the class timings of an earlier run

defaults:
  run:
    shell: bash  # container jobs default to sh, which has no pipefail

env:
  PGHOST: postgres
  PGUSER: odoo
  PGPASSWORD: odoo
  PGDATABASE: odoo
  OCA_ENABLE_CHECKLOG_ODOO: "1"

jobs:
  install:
    runs-on: arc-bemade-addons
    timeout-minutes: 45
    container:
      # Portless: the runners' pull secret is keyed by the exact host string.
      image: registry.bemade.org/bemade/docker-odoo-enterprise/odoo-enterprise-ci:${{ github.base_ref }}
      options: --user root
    name: Install addons
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare addons
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash .github/ci/prepare.sh
      - name: Install dependencies (without tests)
        run: |
          ADDONS_DIR="${GITHUB_WORKSPACE}"
          DEPS=$(manifestoo --select-addons-dir ${ADDONS_DIR} --select-exclude "${EXCLUDE}" list-depends --separator=,)
          echo "Dependencies: ${DEPS:-base}"
          oca_wait_for_postgres
          unbuffer $(which odoo) \
            -d ${PGDATABASE} \
            -i ${DEPS:-base} \
            --addons-path=${ADDONS_PATH},${ADDONS_DIR} \
            --http-interface=127.0.0.1 \
            --stop-after-init
      - name: Find the latest class timings
        id: timings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                 "/actions/artifacts?name=test-timings&per_page=1")
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
          })
          artifacts = json.load(urllib.request.urlopen(request))['artifacts']
          if artifacts and not artifacts[0]['expired']:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"run_id={artifacts[0]['workflow_run']['id']}\n")
          EOF
      - uses: actions/download-artifact@v4
        if: steps.timings.outputs.run_id
        continue-on-error: true
        with:
          name: test-timings
          path: /tmp/timings
          github-token: ${{ github.token }}
          run-id: ${{ steps.timings.outputs.run_id }}
      - name: Plan test shards
        id: plan
        run: |
          ADDONS_DIR="${GITHUB_WORKSPACE}"
          ADDONS=$(manifestoo --select-addons-dir ${ADDONS_DIR} --select-exclude "${EXCLUDE}" list --separator=,)
          echo "ADDONS=${ADDONS}" >> "${GITHUB_ENV}"
          mkdir -p /tmp/odoo-db
          python3 .github/ci/plan_shards.py \
            --addons "${ADDONS}" \
            --addons-path "${ADDONS_PATH},${ADDONS_DIR}" \
            --timings /tmp/timings/test-timings.json \
            --max-shards 6 \
            --out /tmp/odoo-db/shards.json \
            --install-tags-out /tmp/odoo-db/install-tags
      - name: Install addons and run at_install tests
        run: |
          ADDONS_DIR="${GITHUB_WORKSPACE}"
          echo "Installing addons: ${ADDONS}"
          unbuffer $(which odoo) \
            -d ${PGDATABASE} \
            -i ${ADDONS} \
            --addons-path=${ADDONS_PATH},${ADDONS_DIR} \
            --test-enable \
            --test-tags "$(cat /tmp/odoo-db/install-tags)" \
            --http-interface=127.0.0.1 \
            --stop-after-init 2>&1 | tee test-output.log
      - name: Dump and encrypt the database
        env:
          # The dump holds Odoo Enterprise views and assets, and artifacts of a
          # public repository can be downloaded by anyone: never upload it in
          # clear. Unset on fork pull requests, which cannot pull the image anyway.
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          : "${CI_ARTIFACT_KEY:?CI_ARTIFACT_KEY is not set; refusing to upload the database unencrypted}"
          DATA_DIR=$(python3 -c "from odoo.tools import config; config.parse_config([]); print(config['data_dir'])" | tail -1)
          pg_dump -Fc -f /tmp/odoo-db/db.dump ${PGDATABASE}
          tar -C "${DATA_DIR}" -cf /tmp/odoo-db/data-dir.tar .
          mkdir -p /tmp/odoo-db-upload
          tar -C /tmp/odoo-db -cf - . \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CI_ARTIFACT_KEY -out /tmp/odoo-db-upload/odoo-db.tar.enc
      - uses: actions/upload-artifact@v4
        with:
          name: odoo-db
          path: /tmp/odoo-db-upload/odoo-db.tar.enc
          retention-days: 1

  test:
    needs: install
    if: needs.install.outputs.shards != '[]'
    runs-on: arc-bemade-addons
    # A shard takes well under 15 min. Without a limit, a hung test (e.g. a
    # clock left frozen, so an HttpCase waits forever for Chrome to exit)
    # holds the job for GitHub's 6 h default.
    timeout-minutes: 45
    container:
      image: registry.bemade.org/bemade/docker-odoo-enterprise/odoo-enterprise-ci:${{ github.base_ref }}
      options: --user root
    name: Test shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.install.outputs.shards) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare addons
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash .github/ci/prepare.sh
      - uses: actions/download-artifact@v4
        with:
          name: odoo-db
          path: /tmp/odoo-db-upload
      - name: Restore the database
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          mkdir -p /tmp/odoo-db
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CI_ARTIFACT_KEY -in /tmp/odoo-db-upload/odoo-db.tar.enc \
            | tar -C /tmp/odoo-db -xf -
          DATA_DIR=$(python3 -c "from odoo.tools import config; config.parse_config([]); print(config['data_dir'])" | tail -1)
          oca_wait_for_postgres
          dropdb --if-exists ${PGDATABASE}
          createdb ${PGDATABASE}
          pg_restore --no-owner -j 4 -d ${PGDATABASE} /tmp/odoo-db/db.dump
          mkdir -p "${DATA_DIR}"
          tar -C "${DATA_DIR}" -xf /tmp/odoo-db/data-dir.tar
      - name: Run post_install tests
        run: |
          ADDONS_DIR="${GITHUB_WORKSPACE}"
          # -at_install: without -i, Odoo would run at_install tests while the
          # registry is still loading. The install job has run them already.
          TAGS=$(python3 -c "import json, sys; print(','.join('/' + c for c in json.load(open('/tmp/odoo-db/shards.json'))[int(sys.argv[1])]))" ${{ matrix.shard }}),-at_install
          echo "Test tags: ${TAGS}"
          unbuffer $(which odoo) \
            -d ${PGDATABASE} \
            --addons-path=${ADDONS_PATH},${ADDONS_DIR} \
            --test-enable \
            --test-tags "${TAGS}" \
            --http-interface=127.0.0.1 \
            --stop-after-init 2>&1 | tee test-output.log
      - name: Measure class timings
        if: always()
        run: python3 .github/ci/class_timings.py test-output.log > timings-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.shard }}
          path: timings-${{ matrix.shard }}.json
          retention-days: 1

  result:
    needs: [install, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: Test Repo Addons With Odoo
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: timings-*
          path: timings
          merge-multiple: true
      - name: Merge class timings
        run: |
          python3 - <<'EOF'
          import glob, json
          merged = {}
          for path in glob.glob('timings/timings-*.json'):
              with open(path) as f:
                  merged.update(json.load(f))
          print(f'{len(merged)} classes timed')
          if merged:  # an empty file would become the latest timings
              with open('test-timings.json', 'w') as f:
                  json.dump(merged, f, indent=0, sort_keys=True)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: test-timings
          path: test-timings.json
          if-no-files-found: ignore
      - name: Check the install job and every shard passed
        run: |
          echo "install: ${{ needs.install.result }}, test shards: ${{ needs.test.result }}"
          test "${{ needs.install.result }}" = success
          # skipped only when there was no post_install class to shard
          test "${{ needs.test.result }}" = success -o "${{ needs.test.result }}" = skipped
